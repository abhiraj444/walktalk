name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate and Prepare APKs
        id: apk-prep
        run: |
          mkdir -p release-apks
          for apk in $(find app/build/outputs/apk/release -name "*.apk"); do
            filename=$(basename "$apk")
            echo "Found APK: $filename"
            friendly_name="WalkTalk-${filename#app-}"
            cp "$apk" "release-apks/$friendly_name"
          done
          ls -la release-apks/

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WalkTalk-release-apks
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('WalkTalk Release v1.0.{0}', github.run_number) }}
          body: |
            ## WalkTalk Android APK Release 🎙️📱
            
            ### Which APK should I download?
            - **`WalkTalk-arm64-v8a-release.apk` (~14.9 MB - Recommended)**: For all modern Android smartphones (arm64-v8a).
            - **`WalkTalk-universal-release.apk` (~48.9 MB)**: Universal build that runs on any Android architecture.
            - **`WalkTalk-armeabi-v7a-release.apk` (~9.9 MB)**: For older 32-bit Android phones.
            
            ### What's New:
            - **Serverless Cloud Mode (No PC Required)**: Full WebRTC signaling directly over Firebase Realtime Database. WalkTalk works anywhere with zero computer setup!
            - **Hybrid Architecture Preserved**: Seamlessly upgrades to Local LAN or Cloudflare Tunnel if a local PC server is running.
            - **Push-to-Talk Intercom**: True intercom audio playback directly through speakerphone with instant Opus-optimized audio.
            - **Live GPS Family Map & SOS**: Background location updates and emergency family broadcast.
            - **76% Smaller APK**: Optimized with R8 minification and ABI splits.
          files: release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
